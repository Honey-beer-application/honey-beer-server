apiVersion: 1
datasources:

- name: k6influxdb
  type: influxdb
  access: proxy
  database: k6
  url: http://influxdb:8086
  isDefault: true

- name: tempo
  uid: tempo
  type: tempo
  access: proxy
  url: http://tempo:3200
  basicAuth: false
  apiVersion: 1
  jsonData:
    httpMethod: GET
    serviceMap:
      datasourceUid: prometheus
    nodeGraph:
      enabled: true
    tracesToLogsV2:
      customQuery: true
      query: '{appname="grafana"} |~ "\\\\\"traceID\\\\\":\\\\\"$${__trace.traceId}\\\\"'
      spanEndTimeShift: 1m
      spanStartTimeShift: -1m
      datasourceUid: loki
      filterByTraceID: false
    lokiSearch:
      datasourceUid: loki
   
- name: prometheus
  uid: prometheus
  type: prometheus
  access: proxy
  url: http://prometheus:9090
  jsonData:
    timeInterval: 60s
    httpMethod: POST

- name: Loki
  uid: loki
  type: loki
  access: proxy
  orgId: 1
  url: http://loki:3100
  basicAuth: false
  isDefault: false
  version: 1
  editable: false